[package]
name = "apple-ship"
version = "0.1.0"
edition = "2021"
description = "Ship macOS Tauri, GPUI, and native apps from GitHub Actions"
license = "MIT"
repository = "https://github.com/meritozh/apple-ship"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
plist = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
